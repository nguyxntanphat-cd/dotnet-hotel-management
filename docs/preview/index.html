<style>
/* Bố cục: mô phỏng cửa sổ WinForms (menu trái tối, thanh trên trắng, vùng nội dung xám nhạt), dùng đúng bảng màu trong UI/Theme.cs.
   Giao diện một chủ đề sáng có chủ ý, giống ứng dụng desktop. */
:root {
  --primary: #1d4ed8; --primary-hover: #1e40af; --primary-soft: #dbeafe;
  --sidebar: #0f172a; --sidebar-hover: #1e293b; --sidebar-text: #cbd5e1; --sidebar-muted: #64748b;
  --bg: #f1f5f9; --surface: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
  --success: #16a34a; --warning: #d97706; --danger: #dc2626; --info: #0891b2; --violet: #7c3aed; --gray: #64748b;
  --page: #e2e8f0;
  --font: "Segoe UI", "Noto Sans", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 13px; }
body { padding-block: 16px 32px; padding-inline: 16px; }
.intro { max-width: 1240px; margin: 0 auto 12px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.intro h1 { font-size: 18px; margin: 0; text-wrap: balance; }
.intro p { margin: 2px 0 0; color: var(--muted); max-width: 70ch; }
.intro .roles { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.intro .roles span { color: var(--muted); margin-right: 4px; }
.scroller { overflow-x: auto; max-width: 1240px; margin: 0 auto; border-radius: 8px; box-shadow: 0 10px 30px rgba(15, 23, 42, .18); }
.window { min-width: 1180px; background: var(--bg); border: 1px solid #94a3b8; border-radius: 8px; overflow: hidden; }
.titlebar { height: 32px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 0 0 12px; font-size: 12px; }
.titlebar .ttl { flex: 1; }
.titlebar .wbtn { width: 46px; height: 32px; display: grid; place-items: center; color: var(--muted); }
.titlebar .wbtn.x:hover { background: #e81123; color: #fff; }
.app { display: flex; height: 860px; }

/* Sidebar */
.side { width: 250px; background: var(--sidebar); display: flex; flex-direction: column; flex-shrink: 0; }
.brand { height: 64px; color: #fff; font-weight: 700; font-size: 18px; display: flex; align-items: center; padding-left: 20px; gap: 10px; }
.brand .logo { width: 30px; height: 30px; border-radius: 6px; background: var(--primary); display: grid; place-items: center; font-size: 15px; }
.menu { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
.menu .grp { color: var(--sidebar-muted); font-size: 10.5px; font-weight: 700; letter-spacing: .06em; margin: 14px 10px 4px; text-transform: uppercase; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: transparent; color: var(--sidebar-text); font: inherit; padding: 9px 14px; border-radius: 4px; cursor: pointer; margin: 1px 0; }
.menu button:hover { background: var(--sidebar-hover); }
.menu button.on { background: var(--primary); color: #fff; font-weight: 700; }
.menu button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.topbar { height: 56px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px 0 24px; gap: 28px; }
.crumb { flex: 1; color: var(--muted); }
.who { text-align: right; line-height: 1.3; }
.who b { display: block; }
.who small { color: var(--muted); }
.content { flex: 1; overflow: auto; padding: 16px 24px 20px; display: flex; flex-direction: column; min-height: 0; }
.vhead h2 { font-size: 22px; margin: 0; }
.vhead p { margin: 4px 0 12px; color: var(--muted); }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar .sp { width: 10px; }
.toolbar label { color: var(--muted); }
.body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 14px; min-height: 0; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.btn { font: inherit; font-weight: 700; border: 0; border-radius: 3px; padding: 0 16px; height: 32px; cursor: pointer; background: var(--primary); color: #fff; white-space: nowrap; }
.btn:hover { background: var(--primary-hover); }
.btn.sec { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn.sec:hover { background: var(--bg); }
.btn.danger { background: var(--danger); }
.btn.success { background: var(--success); }
.btn.block { width: 100%; height: 40px; }
input[type=text], input[type=password], input[type=date], input[type=number], select { font: inherit; height: 30px; border: 1px solid #a3b1c2; border-radius: 2px; padding: 0 8px; background: var(--surface); color: var(--text); }
input.search { width: 250px; }

.card { background: var(--surface); border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.card > h3 { font-size: 15px; margin: 0; padding: 12px 16px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .pad { padding: 4px 16px 14px; }
.gridwrap { overflow: auto; flex: 1; min-height: 0; }
table.grid { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.grid th { position: sticky; top: 0; background: #f8fafc; color: var(--muted); text-align: left; font-weight: 700; height: 36px; padding: 0 10px; white-space: nowrap; border-bottom: 1px solid var(--border); }
.grid td { height: 32px; padding: 0 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.grid tr:nth-child(even) td { background: #fafbfd; }
.grid tbody tr { cursor: default; }
.grid tbody tr.sel td { background: var(--primary-soft); }
.grid tbody tr:hover td { background: #eef4ff; }
.grid tr.hl td { background: #fef9c3; }
.grid tr.late td { background: #fee2e2; }
.grid .r { text-align: right; }
.st { font-weight: 700; }
.st.Success { color: var(--success); } .st.Warning { color: var(--warning); } .st.Primary { color: var(--primary); }
.st.Danger { color: var(--danger); } .st.Info { color: var(--info); } .st.Gray { color: var(--gray); }

.stats { display: flex; gap: 14px; }
.stat { width: 200px; background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c); padding: 12px 16px; }
.stat .t { color: var(--muted); }
.stat .v { font-size: 26px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
.stat .n { color: var(--c); font-size: 11.5px; }

/* Room map */
.legend { display: flex; gap: 22px; align-items: center; margin-bottom: 4px; }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -1px; }
.floor { color: var(--muted); font-weight: 700; margin: 8px 0 6px; letter-spacing: .04em; }
.tiles { display: flex; flex-wrap: wrap; gap: 12px; }
.tile { width: 170px; height: 108px; border: 1px solid; border-top-width: 5px; padding: 8px 10px; cursor: pointer; position: relative; }
.tile.sel { outline: 2px solid var(--text); }
.tile .no { font-size: 21px; font-weight: 700; }
.tile .lo { color: var(--muted); font-size: 11.5px; }
.tile .s { font-weight: 700; margin-top: 2px; }
.tile .x { font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.ctx { position: absolute; z-index: 5; background: var(--surface); border: 1px solid #94a3b8; box-shadow: 0 4px 14px rgba(0,0,0,.15); min-width: 210px; padding: 3px 0; }
.ctx div { padding: 6px 14px; cursor: pointer; }
.ctx div:hover { background: var(--primary-soft); }
.ctx div.dis { color: #94a3b8; cursor: default; background: none; }

/* form rows */
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; }
.kv span:nth-child(odd) { color: var(--muted); }
.field { display: grid; grid-template-columns: 150px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
.field label { color: var(--muted); }
.money { display: flex; justify-content: space-between; padding: 4px 0; }
.total { font-size: 24px; font-weight: 700; color: var(--primary); }
.sec-t { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 11.5px; margin: 14px 0 4px; }
.bar { height: 8px; background: var(--bg); margin: 4px 0 12px; }
.bar i { display: block; height: 100%; }

/* tabs */
.tabs { display: flex; border-bottom: 1px solid #a3b1c2; }
.tabs button { font: inherit; border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 16px; cursor: pointer; color: var(--text); margin-bottom: -1px; }
.tabs button.on { background: var(--bg); border-color: #a3b1c2; font-weight: 700; }

/* dialog */
.modal { position: fixed; inset: 0; background: rgba(15, 23, 42, .35); display: grid; place-items: center; z-index: 20; padding: 16px; }
.dlg { background: var(--surface); width: 520px; max-width: 100%; border: 1px solid #94a3b8; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.dlg .dt { height: 32px; display: flex; align-items: center; justify-content: space-between; padding-left: 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
.dlg .db { padding: 20px 24px 8px; }
.dlg .df { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 24px 20px; }
.dlg .field input, .dlg .field select { width: 100%; }
.note { color: var(--primary); font-weight: 600; margin: 4px 0 10px 160px; }
.err { color: var(--danger); margin: 4px 0 10px 160px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--sidebar); color: #fff; padding: 10px 18px; border-radius: 4px; z-index: 30; max-width: calc(100% - 32px); }

/* Login */
.login { display: flex; height: 100%; }
.login .l { width: 400px; background: var(--sidebar); color: #fff; padding: 110px 48px 0; position: relative; }
.login .l .logo { width: 64px; height: 64px; border-radius: 12px; background: var(--primary); display: grid; place-items: center; font-size: 30px; }
.login .l h1 { font-size: 32px; margin: 24px 0 6px; }
.login .l p { color: var(--sidebar-text); font-size: 15px; margin: 0 0 16px; }
.login .l small { color: var(--sidebar-muted); display: block; line-height: 1.6; }
.login .l .foot { position: absolute; bottom: 30px; left: 48px; }
.login .r { flex: 1; padding: 110px 0 0 90px; background: var(--surface); }
.login .r h2 { font-size: 26px; margin: 0; }
.login .r input { width: 360px; height: 36px; font-size: 14px; display: block; margin: 6px 0 16px; }
.login .r .hint { color: var(--muted); margin-top: 18px; line-height: 1.6; font-size: 12px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<div class="intro">

    <p>Mô phỏng HTML các màn hình của ứng dụng C# WinForms trong repo (cùng bố cục, màu sắc, dữ liệu mẫu). Nhấp menu bên trái để chuyển màn hình. Ứng dụng thật chạy bằng <code>dotnet run</code> trên Windows.</p>

  <div class="window">
    <div class="titlebar"><span class="ttl" id="wtitle">Hệ thống quản lý khách sạn</span><span class="wbtn">—</span><span class="wbtn">☐</span><span class="wbtn x">✕</span></div>
    <div class="app" id="app"></div>
  </div>
</div>

<script>
(() => {
// ================= Dữ liệu mẫu (giống Data/MockDb.cs) =================
let seed = 2026;
const rnd = (a, b) => { // mulberry32: số ngẫu nhiên cố định để dữ liệu mẫu giống nhau mỗi lần mở
  seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return a + Math.floor(((t ^ (t >>> 14)) >>> 0) / 4294967296 * (b - a)); };
const today = new Date(); today.setHours(0, 0, 0, 0);
const addD = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const fd = d => d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fdm = d => d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
const fdt = d => fd(d) + ' ' + d.toTimeString().slice(0, 5);
const N = v => Math.round(v).toLocaleString('vi-VN');
const S = { Trong: 'Trống', DaDat: 'Đã đặt', DangO: 'Đang ở', DangDon: 'Đang dọn', BaoTri: 'Bảo trì' };
const COLOR = { 'Trống': 'Success', 'Đã đặt': 'Warning', 'Đang ở': 'Primary', 'Đang dọn': 'Info', 'Bảo trì': 'Danger',
  'Chờ nhận phòng': 'Warning', 'Đã nhận phòng': 'Primary', 'Hoàn tất': 'Success', 'Đã hủy': 'Gray', 'Đã trả phòng': 'Gray',
  'Đã thanh toán': 'Success', 'Chưa thanh toán': 'Danger', 'Thanh toán một phần': 'Warning', 'Chưa lập': 'Gray',
  'Hoạt động': 'Success', 'Đã khóa': 'Danger', 'Đang kinh doanh': 'Success', 'Ngừng kinh doanh': 'Gray' };
const HEX = { Success: '#16a34a', Warning: '#d97706', Primary: '#1d4ed8', Info: '#0891b2', Danger: '#dc2626', Gray: '#64748b' };
const st = s => `<span class="st ${COLOR[s] || 'Gray'}">${s}</span>`;

const NV = [
  ['NV001', 'Nguyễn Tấn Phát', '12/03/1990', '0901234567', 'phat.nt@hotel.vn', 'Quản trị viên'],
  ['NV002', 'Trần Thị Mai', '04/07/1985', '0912345678', 'mai.tt@hotel.vn', 'Quản lý'],
  ['NV003', 'Lê Hoàng Nam', '20/11/1998', '0987654321', 'nam.lh@hotel.vn', 'Lễ tân'],
  ['NV004', 'Phạm Ngọc Anh', '15/01/2000', '0934567890', 'anh.pn@hotel.vn', 'Lễ tân'],
  ['NV005', 'Võ Văn Hùng', '30/05/1992', '0978123456', 'hung.vv@hotel.vn', 'Nhân viên buồng phòng'],
  ['NV006', 'Đặng Thu Hà', '09/09/1995', '0965432187', 'ha.dt@hotel.vn', 'Nhân viên buồng phòng'],
  ['NV007', 'Bùi Minh Tuấn', '18/02/1997', '0944556677', 'tuan.bm@hotel.vn', 'Lễ tân'],
].map(([ma, ten, ns, sdt, email, cv]) => ({ ma, ten, ns, sdt, email, cv }));
const TK = [
  ['TK001', 'admin', 'Quản trị viên', 'NV001', 'Hoạt động'], ['TK002', 'quanly', 'Quản lý', 'NV002', 'Hoạt động'],
  ['TK003', 'letan', 'Lễ tân', 'NV003', 'Hoạt động'], ['TK004', 'letan2', 'Lễ tân', 'NV004', 'Đã khóa'],
  ['TK005', 'buongphong', 'Nhân viên buồng phòng', 'NV005', 'Hoạt động'],
].map(([ma, user, vt, nv, tt]) => ({ ma, user, vt, nv, tt }));
const LP = [
  ['LP01', 'Standard', 500000, 2, 'Phòng tiêu chuẩn, 1 giường đôi, 20m²'], ['LP02', 'Superior', 750000, 2, '2 giường đơn, cửa sổ hướng phố, 25m²'],
  ['LP03', 'Deluxe', 1100000, 3, 'Giường King, ban công, bồn tắm, 32m²'], ['LP04', 'Family', 1500000, 4, '2 giường đôi, phù hợp gia đình, 40m²'],
  ['LP05', 'Suite', 2500000, 4, 'Phòng khách riêng, view toàn cảnh, 60m²'],
].map(([ma, ten, gia, sc, mota]) => ({ ma, ten, gia, sc, mota }));
const tetY = today.getFullYear() + (today.getMonth() > 1 ? 1 : 0);
const BG = [
  ['BG001', 'LP03', new Date(tetY, 0, 25), new Date(tetY, 1, 4), 1450000, 'Tết Nguyên đán'],
  ['BG002', 'LP04', new Date(tetY, 0, 25), new Date(tetY, 1, 4), 1950000, 'Tết Nguyên đán'],
  ['BG003', 'LP05', new Date(tetY, 0, 25), new Date(tetY, 1, 4), 3200000, 'Tết Nguyên đán'],
  ['BG004', 'LP01', new Date(today.getFullYear(), 11, 24), new Date(today.getFullYear() + 1, 0, 2), 650000, 'Giáng sinh & Năm mới'],
].map(([ma, loai, tu, den, gia, note]) => ({ ma, loai, tu, den, gia, note }));
const loai = m => LP.find(l => l.ma === m);
const PH = [];
for (let t = 1; t <= 5; t++) for (let i = 1; i <= 6; i++) {
  let l = ['', 'LP01', 'LP02', 'LP03', 'LP04', 'LP05'][t];
  if (t === 2 && i >= 5) l = 'LP01'; if (t === 5 && i >= 4) l = 'LP04';
  PH.push({ ma: 'P' + t + '0' + i, so: t + '0' + i, tang: t, loai: l, tt: S.Trong });
}
const phong = m => PH.find(p => p.ma === m);
const KH = [['Nguyễn Văn An', 'Q.1, TP.HCM'], ['Trần Thị Bích', 'Q.3, TP.HCM'], ['Lê Minh Châu', 'Hà Nội'], ['Phạm Quốc Dũng', 'Đà Nẵng'],
  ['Hoàng Thị Em', 'Cần Thơ'], ['Vũ Đức Giang', 'Hải Phòng'], ['Đỗ Thanh Hương', 'Q.7, TP.HCM'], ['Bùi Văn Khoa', 'Biên Hòa, Đồng Nai'],
  ['Ngô Thị Lan', 'Huế'], ['Dương Quang Minh', 'Nha Trang'], ['Lý Thu Ngân', 'Vũng Tàu'], ['Trịnh Công Phú', 'Thủ Đức, TP.HCM'],
  ['John Smith', 'London, UK'], ['Kim Min-jun', 'Seoul, Hàn Quốc'], ['Tạ Hồng Quân', 'Bình Dương'], ['Mai Anh Thư', 'Q.10, TP.HCM'],
  ['Châu Gia Bảo', 'Long An'], ['Hồ Ngọc Diệp', 'Đà Lạt']].map(([ten, dc], i) => {
  const ngoai = i === 12 || i === 13;
  return { ma: 'KH' + String(i + 1).padStart(3, '0'), ten, dc, cccd: ngoai ? 'P' + rnd(1000000, 9999999) : '0792' + rnd(10000000, 99999999),
    sdt: ngoai ? '+82 10' + rnd(1000000, 9999999) : '09' + rnd(10000000, 99999999),
    email: ten.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase().replace(/ /g, '.') + '@gmail.com' };
});
const kh = m => KH.find(k => k.ma === m);
const DV = [['DV01', 'Ăn sáng buffet', 120000, 'suất'], ['DV02', 'Giặt ủi', 35000, 'kg'], ['DV03', 'Nước suối', 15000, 'chai'], ['DV04', 'Bia lon', 30000, 'lon'],
  ['DV05', 'Đưa đón sân bay', 250000, 'lượt'], ['DV06', 'Thuê xe máy', 150000, 'ngày'], ['DV07', 'Spa & massage', 400000, 'giờ'], ['DV08', 'Snack minibar', 25000, 'gói'],
  ['DV09', 'Trang trí phòng', 500000, 'lần']].map(([ma, ten, gia, dvt], i) => ({ ma, ten, gia, dvt, tt: i === 8 ? 'Ngừng kinh doanh' : 'Đang kinh doanh' }));
const dv = m => DV.find(d => d.ma === m);
const giaPhong = (ml, d) => (BG.find(b => b.loai === ml && d >= b.tu && d <= b.den) || {}).gia || loai(ml).gia;
const soDem = (a, b) => Math.max(1, Math.round((new Date(b).setHours(0,0,0,0) - new Date(a).setHours(0,0,0,0)) / 864e5));
const DP = [], LT = [], CT = [], SD = [], HD = [], TT = [];
const pad = (p, n, w) => p + String(n).padStart(w, '0');
const PT = ['Tiền mặt', 'Chuyển khoản', 'Thẻ ngân hàng', 'Ví điện tử'];
const dvBan = DV.filter(d => d.tt === 'Đang kinh doanh');
// Lịch sử 6 tháng
for (let i = 0; i < 900; i++) {
  const p = PH[rnd(0, PH.length)], k = KH[rnd(0, KH.length)];
  const nhan = addD(today, -rnd(3, 182)), dem = rnd(1, 5);
  const dp = { ma: pad('DP', DP.length + 1, 3), ngayDat: addD(nhan, -rnd(1, 20)), nhan, tra: addD(nhan, dem), tt: 'Hoàn tất', kh: k.ma, phong: p.ma, note: '' }; DP.push(dp);

function grid(cols, rows, opts = {}) {
  const head = cols.map(c => `<th class="${c.r ? 'r' : ''}" style="${c.w ? 'width:' + c.w + 'px' : ''}">${c.h}</th>`).join('');
  const body = rows.map((r, i) => `<tr data-i="${i}" class="${opts.rowClass ? opts.rowClass(r) : ''} ${opts.sel === i ? 'sel' : ''}">` +
    cols.map(c => { const v = c.f(r); return `<td class="${c.r ? 'r' : ''}">${c.s ? st(v) : esc(v)}</td>`; }).join('') + '</tr>').join('');
  return `<div class="gridwrap"><table class="grid"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const card = (title, inner, style = '', right = '') => `<div class="card" style="${style}">${title ? `<h3><span>${title}</span>${right}</h3>` : ''}${inner}</div>`;
const statCard = (t, v, c, n) => `<div class="stat" style="--c:var(--${c})"><div class="t">${t}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
const head = (t, s) => `<div class="vhead"><h2>${t}</h2><p>${s}</p></div>`;

const short = v => v >= 1e9 ? (v / 1e9).toFixed(2).replace('.', ',') + ' tỷ' : v >= 1e6 ? (v / 1e6).toFixed(1).replace('.', ',') + ' tr' : N(v);

function chart(data, series, colors, h = 230, perBar = false) {
  const W = 760, H = h, L = 56, T = series.length > 1 ? 30 : 12, B = 26, R = 10;
  const max0 = Math.max(1, ...data.map(d => d[1].reduce((a, b) => a + b, 0)));
  const mag = Math.pow(10, Math.floor(Math.log10(max0 / 4))), n = max0 / 4 / mag, step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * mag;
  const max = Math.ceil(max0 / step) * step, ah = H - T - B, aw = W - L - R, slot = aw / data.length, bw = Math.min(42, slot * .6);
  const shortN = v => v >= 1e6 ? +(v / 1e6).toFixed(1) + 'tr' : v >= 1e3 ? +(v / 1e3).toFixed(1) + 'k' : String(v);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" style="display:block;font-size:11px">`;
  for (let v = 0; v <= max + 1e-6; v += step) { const y = T + ah - v / max * ah; s += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="#e2e8f0"/><text x="${L - 6}" y="${y + 4}" text-anchor="end" fill="#64748b">${shortN(v)}</text>`; }
  const every = Math.max(1, Math.ceil(data.length / (aw / 50)));
  data.forEach(([lab, vals], i) => {
    const x = L + slot * i + (slot - bw) / 2; let y = T + ah;
    vals.forEach((v, k) => { const hh = v / max * ah; y -= hh; s += `<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${colors[perBar ? i : k]}"/>`; });
    if (data.length <= 14) s += `<text x="${x + bw / 2}" y="${y - 4}" text-anchor="middle" fill="#64748b">${shortN(vals.reduce((a, b) => a + b, 0))}</text>`;
    if (i % every === 0) s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" fill="#64748b">${lab}</text>`;
  });
  if (series.length > 1) { let lx = L; series.forEach((n, k) => { s += `<rect x="${lx}" y="6" width="12" height="12" fill="${colors[k]}"/><text x="${lx + 16}" y="16" fill="#64748b">${n}</text>`; lx += n.length * 7 + 40; }); }
  return s + '</svg>';
}

};

VIEWS.tra_phong = () => {
  const rows = LT.filter(l => l.tt === 'Đang ở').sort((a, b) => a.tra - b.tra || phong(a.phong).so.localeCompare(phong(b.phong).so)); state.rows = rows;
  if (state.pre) { state.sel = rows.findIndex(l => l.ma === state.pre); state.pre = null; }
  if (state.sel == null) state.sel = 0; const l = rows[state.sel];
  let detail = '<div class="pad" style="color:var(--muted)">Chọn phòng cần trả ở danh sách bên trái.</div>';
  if (l) {
    const now = new Date(), p = phong(l.phong), dem = soDem(l.nhan, now), tp = dem * l.gia, td = tienDV(l), gg = state.gg || 0, tong = Math.max(0, tp + td - gg), hd = hdOf(l);
    const paid = hd ? TT.filter(t => t.hd === hd.ma).reduce((a, t) => a + t.tien, 0) : 0;
    const grouped = {}; SD.filter(s => s.lt === l.ma).forEach(s => { const k = s.dv + '|' + s.gia; grouped[k] = grouped[k] || { dv: s.dv, gia: s.gia, sl: 0 }; grouped[k].sl += s.sl; });
    const late = today < new Date(l.tra).setHours(0,0,0,0) ? `⚠ Trả sớm so với dự kiến (${fd(l.tra)})` : today > new Date(l.tra).setHours(0,0,0,0) ? `⚠ Trả trễ so với dự kiến (${fd(l.tra)})` : '';
    detail = `<div class="pad"><div style="line-height:1.6">Phòng ${p.so} (${loai(p.loai).ten})  •  <b>${khChinh(l).ten}</b><br>Nhận: ${fdt(l.nhan)}    Trả: ${fdt(now)}<br><span style="color:var(--warning)">${late}</span></div>
      <div class="sec-t">Tiền phòng</div><div class="money"><span style="color:var(--muted)">${dem} đêm × ${N(l.gia)} đ</span><b>${N(tp)} đ</b></div>
      <div class="sec-t">Tiền dịch vụ</div><div style="height:128px;border:1px solid var(--border)">${grid([{ h: 'Dịch vụ', f: x => dv(x.dv).ten }, { h: 'SL', w: 40, r: 1, f: x => x.sl }, { h: 'Đơn giá', w: 85, r: 1, f: x => N(x.gia) }, { h: 'Thành tiền', w: 100, r: 1, f: x => N(x.sl * x.gia) }], Object.values(grouped))}</div>
      <div class="money" style="justify-content:flex-end"><b>Cộng dịch vụ: ${N(td)} đ</b></div>

      <div style="color:var(--muted);margin:2px 0 14px">${hd ? `Hóa đơn ${hd.ma} • Đã thanh toán ${N(paid)} đ • Còn lại ${N(Math.max(0, tong - paid))} đ` : 'Chưa lập hóa đơn'}</div>
      <div style="display:flex;gap:8px"><button class="btn sec" style="height:42px;width:160px" id="lap">Lập hóa đơn</button><button class="btn success" style="height:42px;flex:1" id="pay">Thanh toán & trả phòng</button></div></div>`;
  }
  return head('Trả phòng & thanh toán', 'Tính tiền phòng, tiền dịch vụ, lập hóa đơn và ghi nhận thanh toán khi khách trả phòng.') +
  `<div class="toolbar"><input class="search" style="width:220px" type="text" placeholder="🔍  Số phòng, tên khách..."></div>
  <div class="body"><div class="row" style="flex:1">${card('Phòng đang ở', grid([{ h: 'Phòng', w: 65, f: x => phong(x.phong).so }, { h: 'Khách chính', f: x => khChinh(x).ten }, { h: 'Nhận phòng', w: 105, f: x => fdm(x.nhan) + ' ' + x.nhan.toTimeString().slice(0, 5) },
    { h: 'Trả dự kiến', w: 100, f: x => fd(x.tra) }, { h: 'Hóa đơn', w: 130, s: 1, f: x => (hdOf(x) || {}).tt || 'Chưa lập' }], rows, { sel: state.sel }), 'flex:1')}
  ${card('Chi tiết thanh toán', detail, 'width:470px;flex-shrink:0;overflow:auto')}</div></div>`;
};
function lapHD(l) {
  const now = new Date(), dem = soDem(l.nhan, now), tp = dem * l.gia, td = tienDV(l), gg = Math.min(state.gg || 0, tp + td);
  let hd = hdOf(l); if (!hd) { hd = { ma: pad('HD', HD.length + 1, 4), lt: l.ma }; HD.push(hd); }
  Object.assign(hd, { ngay: now, tp, td, gg, tong: tp + td - gg, tt: hd.tt || 'Chưa thanh toán' }); return hd;
}
function invoice(hd) {
  const l = LT.find(x => x.ma === hd.lt), p = phong(l.phong), k = khChinh(l), dem = soDem(l.nhan, hd.ngay);
  const grouped = {}; SD.filter(s => s.lt === l.ma).forEach(s => { const key = s.dv + '|' + s.gia; grouped[key] = grouped[key] || { dv: s.dv, gia: s.gia, sl: 0 }; grouped[key].sl += s.sl; });

    <div style="font-size:20px;font-weight:700;margin:14px 0 4px">HÓA ĐƠN THANH TOÁN</div><div style="color:var(--muted)">Số: ${hd.ma}   •   Ngày lập: ${fdt(hd.ngay)}</div></div>
    <div class="kv" style="margin:14px 0"><span>Khách hàng:</span><span>${k.ten}</span><span>CCCD/Hộ chiếu:</span><span>${k.cccd || ''}</span><span>Phòng:</span><span>${p.so} - ${loai(p.loai).ten}</span><span>Thời gian ở:</span><span>${fdt(l.nhan)} → ${fdt(hd.ngay)}</span></div>
    <table class="grid"><thead><tr><th>Nội dung</th><th class="r">SL</th><th class="r">Đơn giá</th><th class="r">Thành tiền</th></tr></thead><tbody>${line(`Tiền phòng (${dem} đêm)`, dem, N(l.gia), N(hd.tp))}
    ${Object.values(grouped).map(x => line(dv(x.dv).ten, x.sl, N(x.gia), N(x.sl * x.gia))).join('')}</tbody></table>
    <div style="margin:10px 0 0 200px">${[['Tiền phòng', hd.tp], ['Tiền dịch vụ', hd.td], ['Giảm giá', hd.gg ? -hd.gg : 0], ['TỔNG CỘNG', hd.tong], ['Đã thanh toán', paid]].map(([a, b]) => `<div class="money" ${a === 'TỔNG CỘNG' ? 'style="font-weight:700"' : ''}><span>${a}</span><span>${N(b)} đ</span></div>`).join('')}</div>
    <div style="text-align:right;margin-top:6px">${st(hd.tt)}</div><p style="text-align:center;color:var(--muted)">Cảm ơn quý khách và hẹn gặp lại!</p></div>`, () => toast('Trong ứng dụng C#: nút "In hóa đơn" mở hộp thoại xem trước khi in.'), '🖨  In hóa đơn');
}
BIND.tra_phong = c => {
  rowSelect(c.querySelector('.card'), state.rows, () => { state.gg = 0; render(); });
  const gg = c.querySelector('#gg'); if (!gg) return;
  gg.onchange = e => { state.gg = Math.max(0, +e.target.value || 0); render(); };

  c.querySelector('#lap').onclick = () => { invoice(lapHD(l)); render(); };
  c.querySelector('#pay').onclick = () => {
    const hd = lapHD(l), con = hd.tong - TT.filter(t => t.hd === hd.ma).reduce((a, t) => a + t.tien, 0);
    dialog('Thanh toán hóa đơn ' + hd.ma, `<p style="color:var(--primary);font-weight:600;margin:0 0 12px">Tổng hóa đơn: ${N(hd.tong)} đ  •  Còn phải thu: ${N(con)} đ</p>
      <div class="field"><label>Phương thức</label>${sel(PT, PT[0], 'pt', 300)}</div><div class="field"><label>Số tiền khách trả</label><input type="number" id="tien" value="${con}" step="10000"></div>`, m => {
      const v = +m.querySelector('#tien').value; if (!(v > 0)) return 'Số tiền phải lớn hơn 0.';
      TT.push({ ma: pad('TT', TT.length + 1, 4), hd: hd.ma, pt: m.querySelector('#pt').value, tien: Math.min(v, con), tg: new Date(), tt: 'Thành công' });

      hd.tt = paid >= hd.tong ? 'Đã thanh toán' : 'Thanh toán một phần';
      if (hd.tt === 'Đã thanh toán') { l.tt = 'Đã trả phòng'; l.tra = hd.ngay; phong(l.phong).tt = S.DangDon; const d = DP.find(x => x.ma === l.dat); if (d) d.tt = 'Hoàn tất';
        state.sel = 0; render(); setTimeout(() => invoice(hd)); toast(`Khách đã trả phòng ${phong(l.phong).so}. Phòng chuyển sang "Đang dọn".`); }
      else { render(); toast(`Đã ghi nhận thanh toán một phần. Còn nợ ${N(hd.tong - paid)} đ.`); }
    }, 'Lưu');
  };
};

  ${sel(['Tất cả trạng thái', 'Chưa thanh toán', 'Thanh toán một phần', 'Đã thanh toán'], stt, 'stt', 160)}<span class="sp"></span><button class="btn" id="view">Xem / In hóa đơn</button></div>
  <div style="color:var(--primary);font-weight:700;margin-bottom:6px">${rows.length} hóa đơn  •  Tổng giá trị ${N(rows.reduce((a, x) => a + x.tong, 0))} đ  •  Đã thu ${N(rows.reduce((a, x) => a + paid(x), 0))} đ</div>
  <div class="body">${card('', grid([{ h: 'Mã HĐ', w: 80, f: x => x.ma }, { h: 'Ngày lập', w: 125, f: x => fdt(x.ngay) }, { h: 'Phòng', w: 60, f: x => phong(LT.find(l => l.ma === x.lt).phong).so },
    { h: 'Khách hàng', f: x => khChinh(LT.find(l => l.ma === x.lt)).ten }, { h: 'Tiền phòng', w: 105, r: 1, f: x => N(x.tp) }, { h: 'Tiền DV', w: 95, r: 1, f: x => N(x.td) }, { h: 'Giảm giá', w: 85, r: 1, f: x => N(x.gg) },
    { h: 'Tổng tiền', w: 110, r: 1, f: x => N(x.tong) }, { h: 'Đã trả', w: 105, r: 1, f: x => N(paid(x)) }, { h: 'Trạng thái', w: 140, s: 1, f: x => x.tt }], rows, { sel: state.sel ?? 0 }), 'flex:1')}
  ${card('Lịch sử thanh toán của hóa đơn', grid([{ h: 'Mã TT', w: 80, f: t => t.ma }, { h: 'Thời gian', w: 140, f: t => fdt(t.tg) }, { h: 'Phương thức', w: 140, f: t => t.pt }, { h: 'Số tiền', w: 130, r: 1, f: t => N(t.tien) }, { h: 'Trạng thái', f: t => t.tt }], h ? TT.filter(t => t.hd === h.ma) : []), 'height:180px')}</div>`;
};
BIND.hoa_don = c => {
  rowSelect(c.querySelector('.card'), state.rows);
  c.querySelector('#stt').onchange = e => { state.stt = e.target.value; state.sel = 0; render(); };
  c.querySelector('#view').onclick = () => { const h = state.rows[state.sel ?? 0]; if (h) invoice(h); };
};

VIEWS.thong_ke = () => {
  const tab = state.tab || 0, preset = state.preset || '30 ngày qua';
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  const [tu, den] = { '7 ngày qua': [addD(today, -6), today], '30 ngày qua': [addD(today, -29), today], 'Tháng này': [first, today], 'Tháng trước': [new Date(first.getFullYear(), first.getMonth() - 1, 1), addD(first, -1)], '6 tháng qua': [new Date(first.getFullYear(), first.getMonth() - 5, 1), today] }[preset];
  const soNgay = Math.round((den - tu) / 864e5) + 1, hds = daThu(tu, den), lts = hds.map(h => LT.find(l => l.ma === h.lt));
  let top = '', body = '';
  if (tab === 0) {
    const nights = l => Math.max(0, Math.round((Math.min(+new Date(l.tra).setHours(0,0,0,0), +addD(den, 1)) - Math.max(+new Date(l.nhan).setHours(0,0,0,0), +tu)) / 864e5));
    const rows = LP.map(lp => { const ps = PH.filter(p => p.loai === lp.ma), c = s => ps.filter(p => p.tt === s).length, dem = LT.filter(l => ps.some(p => p.ma === l.phong)).reduce((a, l) => a + nights(l), 0);
      return [lp.ten, ps.length, c(S.Trong), c(S.DaDat), c(S.DangO), c(S.DangDon), c(S.BaoTri), dem, (Math.min(1, dem / (ps.length * soNgay)) * 100).toFixed(1).replace('.', ',') + '%']; });
    const tong = rows.reduce((a, r) => a + r[7], 0);
    top = statCard('Tổng số phòng', PH.length, 'gray', '5 tầng') + statCard('Đang có khách', PH.filter(p => p.tt === S.DangO).length, 'primary', 'hiện tại') + statCard('Phòng trống', PH.filter(p => p.tt === S.Trong).length, 'success', 'hiện tại') +
      statCard('Đêm phòng đã bán', N(tong), 'warning', `trong ${soNgay} ngày`) + statCard('Công suất trung bình', (Math.min(1, tong / (PH.length * soNgay)) * 100).toFixed(1).replace('.', ',') + '%', 'violet', 'trong kỳ');
    body = card('Theo loại phòng', grid(['Loại phòng', 'Tổng', 'Trống', 'Đã đặt', 'Đang ở', 'Đang dọn', 'Bảo trì', 'Đêm phòng đã bán (kỳ)', 'Công suất (kỳ)'].map((h, i) => ({ h, r: i > 0, w: i ? (i > 6 ? 160 : 75) : 0, f: r => r[i] })), rows), 'flex:1') +
      card('Số phòng theo trạng thái hiện tại', `<div class="pad">${chart(Object.values(S).map(s => [s, [PH.filter(p => p.tt === s).length]]), ['Phòng'], Object.values(S).map(s => HEX[COLOR[s]]), 170, true)}</div>`, 'flex-shrink:0');
  } else if (tab === 1) {
    const m = {}; lts.forEach((l, i) => { const k = khChinh(l); if (!k.ma) return; m[k.ma] = m[k.ma] || { k, luot: 0, dem: 0, chi: 0 }; m[k.ma].luot++; m[k.ma].dem += soDem(l.nhan, l.tra); m[k.ma].chi += hds[i].tong; });
    const rows = Object.values(m).sort((a, b) => b.chi - a.chi), quay = rows.filter(r => LT.some(l => l.nhan < tu && khChinh(l).ma === r.k.ma)).length;
    top = statCard('Lượt lưu trú', lts.length, 'primary', 'đã trả phòng trong kỳ') + statCard('Lượt khách', lts.reduce((a, l) => a + CT.filter(c => c.lt === l.ma).length, 0), 'info', 'gồm khách đi cùng') +
      statCard('Khách hàng khác nhau', rows.length, 'success', 'khách chính') + statCard('Khách quay lại', quay, 'warning', rows.length ? Math.round(quay / rows.length * 100) + '% số khách' : '') +
      statCard('Chi tiêu TB / lượt', short(lts.length ? hds.reduce((a, h) => a + h.tong, 0) / lts.length : 0), 'violet', 'đồng');
    body = card('Khách hàng theo chi tiêu trong kỳ', grid([{ h: '#', w: 45, r: 1, f: r => rows.indexOf(r) + 1 }, { h: 'Mã KH', w: 80, f: r => r.k.ma }, { h: 'Khách hàng', f: r => r.k.ten }, { h: 'SĐT', w: 120, f: r => r.k.sdt },
      { h: 'Số lượt ở', w: 90, r: 1, f: r => r.luot }, { h: 'Số đêm', w: 80, r: 1, f: r => r.dem }, { h: 'Tổng chi tiêu', w: 140, r: 1, f: r => N(r.chi) }], rows), 'flex:1');
  } else if (tab === 2) {
    const byMonth = soNgay > 62;
    const groups = byMonth ? [...Array((den.getFullYear() - tu.getFullYear()) * 12 + den.getMonth() - tu.getMonth() + 1)].map((_, i) => { const mm = new Date(tu.getFullYear(), tu.getMonth() + i, 1);
      return [String(mm.getMonth() + 1).padStart(2, '0') + '/' + mm.getFullYear(), hds.filter(h => h.ngay.getMonth() === mm.getMonth() && h.ngay.getFullYear() === mm.getFullYear())]; })
      : [...Array(soNgay)].map((_, i) => { const d = addD(tu, i); return [fdm(d), hds.filter(h => h.ngay >= d && h.ngay < addD(d, 1))]; });
    const rows = groups.map(([k, l]) => [k, l.length, l.reduce((a, h) => a + h.tp, 0), l.reduce((a, h) => a + h.td, 0), l.reduce((a, h) => a + h.gg, 0), l.reduce((a, h) => a + h.tong, 0)]);
    const tong = hds.reduce((a, h) => a + h.tong, 0), truoc = daThu(addD(tu, -soNgay), addD(tu, -1)).reduce((a, h) => a + h.tong, 0), td = hds.reduce((a, h) => a + h.td, 0);
    top = statCard('Tổng doanh thu', short(tong), 'primary', truoc ? ((tong - truoc) / truoc * 100 >= 0 ? '+' : '') + ((tong - truoc) / truoc * 100).toFixed(1).replace('.', ',') + '% so với kỳ trước' : '') +
      statCard('Tiền phòng', short(hds.reduce((a, h) => a + h.tp, 0)), 'info', 'trước giảm giá') + statCard('Tiền dịch vụ', short(td), 'warning', tong ? Math.round(td / tong * 100) + '% doanh thu' : '') +
      statCard('Số hóa đơn', hds.length, 'success', 'đã thanh toán') + statCard('Doanh thu TB / ngày', short(tong / soNgay), 'violet', byMonth ? 'biểu đồ theo tháng' : 'biểu đồ theo ngày');
    body = card('Biểu đồ doanh thu', `<div class="pad">${chart(rows.map(r => [r[0], [r[2] - r[4], r[3]]]), ['Tiền phòng', 'Tiền dịch vụ'], ['#1d4ed8', '#0891b2'], 220)}</div>`, 'flex-shrink:0') +
      card('Chi tiết theo kỳ', grid(['Kỳ', 'Số HĐ', 'Tiền phòng', 'Tiền dịch vụ', 'Giảm giá', 'Doanh thu'].map((h, i) => ({ h, r: i > 0, w: i ? 130 : 110, f: r => i > 1 ? N(r[i]) : r[i] })), rows), 'flex:1');
  } else {
    const tp = hds.reduce((a, h) => a + h.tp, 0);
    const lr = LP.map(lp => { const x = hds.filter(h => phong(LT.find(l => l.ma === h.lt).phong).loai === lp.ma), dt = x.reduce((a, h) => a + h.tp, 0);
      return [lp.ten, x.length, x.reduce((a, h) => { const l = LT.find(y => y.ma === h.lt); return a + soDem(l.nhan, l.tra); }, 0), N(dt), tp ? (dt / tp * 100).toFixed(1).replace('.', ',') + '%' : '-', dt]; }).sort((a, b) => b[5] - a[5]);
    const ids = new Set(hds.map(h => h.lt)), sd = SD.filter(s => ids.has(s.lt)), tot = sd.reduce((a, s) => a + s.sl * s.gia, 0), m = {};
    sd.forEach(s => { m[s.dv] = m[s.dv] || [dv(s.dv).ten, dv(s.dv).dvt, 0, 0]; m[s.dv][2] += s.sl; m[s.dv][3] += s.sl * s.gia; });
    const dr = Object.values(m).sort((a, b) => b[3] - a[3]).map(r => [r[0], r[1], r[2], N(r[3]), tot ? (r[3] / tot * 100).toFixed(1).replace('.', ',') + '%' : '-']);
    body = `<div class="row" style="flex:1">${card('Doanh thu theo loại phòng', grid(['Loại phòng', 'Lượt ở', 'Đêm', 'Doanh thu phòng', 'Tỷ trọng'].map((h, i) => ({ h, r: i > 0, w: i ? 110 : 0, f: r => r[i] })), lr), 'flex:1')}
      ${card('Doanh thu theo dịch vụ', grid(['Dịch vụ', 'ĐVT', 'Số lượng', 'Doanh thu', 'Tỷ trọng'].map((h, i) => ({ h, r: i > 1, w: i ? 95 : 0, f: r => r[i] })), dr), 'flex:1')}</div>`;
  }
  return head('Thống kê & báo cáo', 'Số liệu tổng hợp theo khoảng thời gian: tình trạng phòng, khách hàng và doanh thu.') +
  `<div class="toolbar"><label>Kỳ</label>${sel(['30 ngày qua', '7 ngày qua', 'Tháng này', 'Tháng trước', '6 tháng qua'], preset, 'pr', 130)}<label>Từ</label><input type="date" value="${tu.toISOString().slice(0, 10)}"><label>đến</label><input type="date" value="${den.toISOString().slice(0, 10)}">
  <button class="btn">Xem thống kê</button><span class="sp"></span><button class="btn success" id="ex">⭳  Xuất báo cáo (Excel/CSV)</button></div>
  <div class="tabs">${['6.1  Tình trạng phòng', '6.2  Khách hàng', '6.3  Doanh thu', '6.4  Báo cáo doanh thu'].map((t, i) => `<button data-t="${i}" class="${i === tab ? 'on' : ''}">${t}</button>`).join('')}</div>
  <div class="body" style="padding-top:12px">${top ? `<div class="stats">${top}</div>` : ''}${body}</div>`;
};
BIND.thong_ke = c => {
  c.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { state.tab = +b.dataset.t; render(); });
  c.querySelector('#pr').onchange = e => { state.preset = e.target.value; render(); };
  c.querySelector('#ex').onclick = () => demo('Trong ứng dụng C#: xuất bảng của tab đang xem ra file CSV mở được bằng Excel (6.5).');
};

// ================= Đăng nhập =================
function login() {
  role = null; document.getElementById('wtitle').textContent = 'Đăng nhập - Hệ thống quản lý khách sạn';
  app.innerHTML = `<div class="login"><div class="l"><div class="logo">🏨</div><h1>SÀI GÒN HOTEL</h1><p>Hệ thống quản lý tòa khách sạn</p>
    <small>Đặt phòng • Nhận phòng • Lưu trú & dịch vụ<br>Trả phòng • Hóa đơn • Thống kê doanh thu</small><small class="foot">Đồ án kết thúc môn học - Khoa CNTT, ĐH Sài Gòn</small></div>
    <form class="r" id="lf"><h2>Đăng nhập</h2><p style="color:var(--muted);margin:6px 0 26px">Vui lòng đăng nhập để tiếp tục</p>
    <b>Tên đăng nhập</b><input type="text" id="lu" value="admin" autocomplete="username"><b>Mật khẩu</b><input type="password" id="lp" value="123" autocomplete="current-password">
    <label style="color:var(--muted)"><input type="checkbox" id="show"> Hiện mật khẩu</label><div id="lerr" style="color:var(--danger);height:22px;margin-top:8px"></div>
    <button class="btn" style="width:360px;height:42px">Đăng nhập</button>
    <div class="hint">Tài khoản demo (mật khẩu 123):<br>admin • quanly • letan • buongphong   (letan2 đang bị khóa)</div></form></div>`;
  app.querySelector('#show').onchange = e => app.querySelector('#lp').type = e.target.checked ? 'text' : 'password';
  app.querySelector('#lf').onsubmit = e => {
    e.preventDefault(); const u = app.querySelector('#lu').value.trim().toLowerCase(), p = app.querySelector('#lp').value, err = app.querySelector('#lerr');
    if (!u || !p) return err.textContent = 'Vui lòng nhập tên đăng nhập và mật khẩu.';
    const t = TK.find(x => x.user === u); if (!t || p !== '123') return err.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.';
    if (t.tt === 'Đã khóa') return err.textContent = 'Tài khoản đã bị khóa. Vui lòng liên hệ quản trị viên.';
    enter(t.vt);
  };
}
function enter(r) { role = r; document.getElementById('wtitle').textContent = 'Hệ thống quản lý khách sạn'; modal.innerHTML = ''; shell(); }
document.querySelectorAll('[data-role]').forEach(b => b.onclick = () => enter(b.dataset.role));
document.getElementById('toLogin').onclick = login;
// Mở thẳng một màn hình qua #ma_chuc_nang (ví dụ #thong_ke), mặc định: quản trị viên ở bảng điều khiển.
const h = location.hash.slice(1);
if (h === 'login') login(); else { enter('Quản trị viên'); if (MENU.some(m => m.key === h)) go(h); }
window.__go = go; window.__enter = enter; window.__login = login;
})();
</script>
