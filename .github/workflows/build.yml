name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore HotelManagement.sln
      - name: Build
        run: dotnet build HotelManagement.sln --configuration Release --no-restore
      - name: Publish (bản chạy được cho Windows)
        run: dotnet publish src/HotelManagement/HotelManagement.csproj -c Release -r win-x64 --self-contained false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: HotelManagement-win-x64
          path: publish
